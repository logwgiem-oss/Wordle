<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Wordle</title><style>
:root{--correct:#6aaa64;--present:#c9b458;--absent:#787c7e;--dark-gray:#3a3a3c;--light-gray:#878a8c;}
body{font-family:sans-serif;background-color:#121213;color:white;display:flex;flex-direction:column;align-items:center;padding:10px;margin:0;}
header{border-bottom:1px solid var(--dark-gray);width:100%;max-width:500px;text-align:center;}
.stats-container{display:flex;gap:20px;margin:10px 0;background:#1a1a1b;padding:10px;border-radius:8px;border:1px solid var(--dark-gray);}
.stat-box{text-align:center;}.stat-value{font-size:1.5rem;font-weight:bold;}.stat-label{font-size:0.75rem;color:var(--light-gray);text-transform:uppercase;}
#alert-banner{background-color:#ba3c3c;padding:10px;border-radius:5px;margin-bottom:15px;display:none;text-align:center;max-width:400px;font-weight:bold;}
#next-btn{background-color:#6aaa64;color:white;border:0;padding:10px 20px;font-size:1rem;font-weight:bold;border-radius:5px;cursor:pointer;margin-bottom:15px;display:none;}
#grid{display:grid;grid-template-rows:repeat(6,1fr);grid-gap:5px;margin-bottom:20px;}
.row{display:grid;grid-template-columns:repeat(5,1fr);grid-gap:5px;}
.tile{width:50px;height:50px;border:2px solid var(--dark-gray);display:inline-flex;justify-content:center;align-items:center;font-size:1.8rem;font-weight:bold;text-transform:uppercase;}
#keyboard{display:grid;grid-gap:6px;width:100%;max-width:500px;}.kb-row{display:flex;justify-content:center;gap:4px;}
.key{background-color:var(--absent);color:white;border:0;height:58px;border-radius:4px;cursor:pointer;font-weight:bold;flex:1;display:flex;justify-content:center;align-items:center;text-transform:uppercase;}
.key.wide{flex:1.5;font-size:0.9rem;}.tile.correct{background-color:var(--correct);border-color:var(--correct);}
.tile.present{background-color:var(--present);border-color:var(--present);}.tile.absent{background-color:var(--dark-gray);border-color:var(--dark-gray);}.tile.active{border-color:var(--light-gray);}
</style></head><body><header><h1>WORDLE</h1></header>
<div class="stats-container">
<div class="stat-box"><div id="current-streak" class="stat-value">0</div><div class="stat-label">Daily Streak</div></div>
<div class="stat-box"><div id="max-streak" class="stat-value">0</div><div class="stat-label">Max Streak</div></div>
</div><button id="next-btn" onclick="startNextGame()">Play Next Word</button><div id="alert-banner"></div><div id="grid"></div>
<div id="keyboard"><div class="kb-row" id="row1"></div><div class="kb-row" id="row2"></div><div class="kb-row" id="row3"></div></div>
<script>
const WORDS=["apple","beach","crane","dance","eagle","flame","giant","house","image","juice","koala","lemon","mouse","night","onion","paper","queen","river","smile","tiger","unite","voice","water","young","zebra","about","above","after","again","agent","agree","ahead","alarm","alive","allow","alone","along","alter","among","anger","angle","angry","apart","apply","arena","argue","arise","array","arrow","aside","asset","audio","audit","avoid","award","aware","awful","baker","bases","basic","basis","basin","buyer","brave","brief","broad","bring","blind","block","brown","board","boast","bonus","bound","brain","brand","bread","break","brick","brush","build","built","bunch","cable","camel","canal","candy","cards","carry","carve","cases","catch","cause","cedar","chain","chair","chalk"];
let targetWord="",currentRow=0,currentTile=0,gameOver=false;
let stats=JSON.parse(localStorage.getItem('wordle_stats'))||{currentStreak:0,maxStreak:0,lastPlayedDate:null};
window.onload=()=>{if(stats.lastPlayedDate){if((getTodayTimestamp()-stats.lastPlayedDate)/86400000>1){stats.currentStreak=0;localStorage.setItem('wordle_stats',JSON.stringify(stats));showAlert("💔 Streak Lost! You forgot to play yesterday.");}}pickWord();createGrid();createKeyboard();updateStatsUI();};
function getTodayTimestamp(){const d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function pickWord(){targetWord=WORDS[Math.floor(Math.random()*WORDS.length)].toUpperCase();}
function createGrid(){const g=document.getElementById("grid");g.innerHTML="";for(let r=0;r<6;r++){let row=document.createElement("div");row.className="row";for(let t=0;t<5;t++){let tile=document.createElement("div");tile.className="tile";tile.id=`r-${r}-t-${t}`;row.appendChild(tile);}g.appendChild(row);}}
function createKeyboard(){const l=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["ENTER","z","x","c","v","b","n","m","BACK"]];l.forEach((row,rIdx)=>{const c=document.getElementById(`row${rIdx+1}`);c.innerHTML="";row.forEach(k=>{const b=document.createElement("button");b.innerText=k;b.className="key";b.id=`key-${k}`;if(k==="ENTER"||k==="BACK")b.classList.add("wide");b.onclick=()=>handleKeyInput(k);c.appendChild(b);});});document.removeEventListener("keydown",handleKB);document.addEventListener("keydown",handleKB);}
function handleKB(e){if(!gameOver){if(e.key==="Enter")handleKeyInput("ENTER");else if(e.key==="Backspace")handleKeyInput("BACK");else if(/^[a-zA-Z]\$/.test(e.key))handleKeyInput(e.key.toLowerCase());}}
function handleKeyInput(k){if(gameOver)return;if(k==="BACK"){if(currentTile > 0){currentTile--;const t=document.getElementById(`r-${currentRow}-t-${currentTile}`);t.innerText="";t.classList.remove("active");document.getElementById("alert-banner").style.display="none";}}else if(k==="ENTER"){if(currentTile===5)evaluateGuess();else showAlert("Not enough letters!");}else if(currentTile<5){const t=document.getElementById(`r-${currentRow}-t-${currentTile}`);t.innerText=k;t.classList.add("active");currentTile++;}}
function evaluateGuess(){let guess="";for(let t=0;t<5;t++)guess+=document.getElementById(`r-${currentRow}-t-${t}`).innerText;
if(!WORDS.includes(guess.toLowerCase())){showAlert("❌ Not a valid word in the dictionary!");return;}
let tl=targetWord.split("");document.getElementById("alert-banner").style.display="none";
for(let t=0;t<5;t++){const tile=document.getElementById(`r-${currentRow}-t-${t}`);if(guess[t]===targetWord[t]){tile.classList.add("correct");updateKey(guess[t].toLowerCase(),"correct");tl[t]=null;}}
for(let t=0;t<5;t++){const tile=document.getElementById(`r-${currentRow}-t-${t}`);if(tile.classList.contains("correct"))continue;const idx=tl.indexOf(guess[t]);if(idx>-1){tile.classList.add("present");updateKey(guess[t].toLowerCase(),"present");tl[idx]=null;}else{tile.classList.add("absent");updateKey(guess[t].toLowerCase(),"absent");}}
if(guess===targetWord){gameOver=true;document.getElementById("next-btn").style.display="block";handleStreak();showAlert("🎉 Correct!");return;}
if(currentRow===5){gameOver=true;document.getElementById("next-btn").style.display="block";handleStreak();showAlert(`Game Over! Word: ${targetWord}`);return;}currentRow++;currentTile=0;}
function handleStreak(){const today=getTodayTimestamp();if(stats.lastPlayedDate!==today){stats.currentStreak++;if(stats.currentStreak>stats.maxStreak)stats.maxStreak=stats.currentStreak;}stats.lastPlayedDate=today;localStorage.setItem('wordle_stats',JSON.stringify(stats));updateStatsUI();}
function updateKey(k,s){const b=document.getElementById(`key-${k}`);if(!b)return;if(s==="correct")b.style.backgroundColor="var(--correct)";else if(s==="present"&&b.style.backgroundColor!=="var(--correct)")b.style.backgroundColor="var(--present)";else if(s==="absent"&&b.style.backgroundColor!=="var(--correct)"&&b.style.backgroundColor!=="var(--present)")b.style.backgroundColor="var(--dark-gray)";}
function startNextGame(){gameOver=false;currentRow=0;currentTile=0;document.getElementById("next-btn").style.display="none";document.getElementById("alert-banner").style.display="none";pickWord();createGrid();createKeyboard();}
function showAlert(m){const b=document.getElementById("alert-banner");b.innerText=m;b.style.display="block";}
function updateStatsUI(){document.getElementById("current-streak").innerText=stats.currentStreak;document.getElementById("max-streak").innerText=stats.maxStreak;}
</script></body></html>
